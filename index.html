<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0d0a14" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Udder Run</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐄</text></svg>" />
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="score">0</div>
  <div id="best">BEST 0</div>
</div>
<div id="combo"></div>
<button id="gear" class="ui" aria-label="Settings">
  <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.4-2.9a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
</button>
<div id="settings" class="ui hidden">
  <label>Graphics <span id="qlabel">High</span></label>
  <input id="quality" type="range" min="0" max="3" step="1" value="2" />
  <label class="row"><span>Sound</span><input id="sound" type="checkbox" checked /></label>
  <label class="row"><span>Jiggle</span><input id="jiggle" type="range" min="0" max="3" step="0.1" value="1" /></label>
</div>
<div id="start" class="overlay">
  <h1>UDDER<br/>RUN</h1>
  <p class="hint"><span class="touch">Tap</span><span class="desk">Space</span> to jump · again in the air to double jump</p>
  <p class="hint small">Hold for a higher jump. Grab the bells. Don't hit the hay.</p>
  <div class="cta"><span class="touch">Tap to start</span><span class="desk">Press Space to start</span></div>
</div>
<div id="over" class="overlay hidden">
  <h2>MOOOOO.</h2>
  <div id="final">0</div>
  <div id="finalBest">BEST 0</div>
  <div class="cta"><span class="touch">Tap to run again</span><span class="desk">Space to run again</span></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
